name: MemVet audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      memvet_ref:
        description: MemVet Git ref to install in calling repositories
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  memory-audit:
    name: Audit engineering memory
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MemVet
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            python -m pip install \
              "git+https://github.com/tsaipraveen99/memvet.git@${{ inputs.memvet_ref }}"
          else
            python -m pip install .
          fi

      - name: Review pull-request memory
        shell: bash
        env:
          MEMVET_BASE_REF: ${{ github.base_ref || 'main' }}
          MEMVET_GREPTILE_API_KEY: ${{ secrets.MEMVET_GREPTILE_API_KEY }}
          MEMVET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          review_args=(review --base "origin/$MEMVET_BASE_REF")
          if [[ -n "${MEMVET_GREPTILE_API_KEY:-}" ]]; then
            review_args+=(
              --greptile
              --repository "${GITHUB_REPOSITORY}"
              --branch "$MEMVET_BASE_REF"
            )
          fi
          memvet "${review_args[@]}" \
            | tee "$RUNNER_TEMP/memvet-review.txt"
          audit_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## MemVet review"
            echo
            cat "$RUNNER_TEMP/memvet-review.txt"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$audit_status"

      - name: Publish review comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REVIEW_REPORT_PATH: ${{ runner.temp }}/memvet-review.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- memvet-review -->';
            const report = fs.readFileSync(process.env.REVIEW_REPORT_PATH, 'utf8').trim();
            const body = [
              marker,
              report,
              '',
              '_Updated automatically by MemVet. External provider results are unverified leads._',
            ].join('\n');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
