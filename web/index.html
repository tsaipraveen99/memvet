<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemVet Review</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { background: #f5f7fb; color: #172033; margin: 0; }
    main { max-width: 980px; margin: 0 auto; padding: 42px 22px 70px; }
    header { align-items: center; display: flex; gap: 18px; justify-content: space-between; margin-bottom: 28px; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: 32px; letter-spacing: -0.04em; margin-bottom: 8px; }
    h2 { font-size: 17px; margin-bottom: 14px; }
    .subtle { color: #657089; }
    .card { background: #fff; border: 1px solid #e1e6f0; border-radius: 16px; box-shadow: 0 8px 24px #1720330d; margin-top: 18px; padding: 22px; }
    .verdict { border-radius: 12px; display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .08em; padding: 8px 12px; }
    .pass { background: #dcfce7; color: #166534; }
    .review { background: #fef3c7; color: #92400e; }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); margin-top: 18px; }
    .stat { background: #f8fafc; border-radius: 10px; padding: 14px; }
    .stat strong { display: block; font-size: 22px; margin-top: 4px; }
    .finding { border-left: 4px solid #f59e0b; margin: 12px 0; padding: 4px 0 4px 14px; }
    .finding strong { display: block; margin-bottom: 5px; }
    .finding p { color: #657089; font-size: 14px; margin-bottom: 4px; }
    code { background: #eef2f7; border-radius: 5px; padding: 2px 5px; }
    .external { border-left-color: #8b5cf6; }
    .warning { color: #92400e; }
    button { background: #172033; border: 0; border-radius: 8px; color: #fff; cursor: pointer; padding: 10px 14px; }
    input { display: none; }
    @media (max-width: 650px) { header { align-items: flex-start; flex-direction: column; } .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>MemVet Review</h1>
        <p class="subtle">Trust-aware context for the next code change.</p>
      </div>
      <label>
        <button type="button">Load report</button>
        <input id="file" type="file" accept="application/json,.json">
      </label>
    </header>
    <section id="app" class="card">
      <p class="subtle">Loading <code>review.json</code>. Generate one with <code>memvet review --base origin/main --json &gt; web/review.json</code>.</p>
    </section>
  </main>
  <script>
    const app = document.querySelector('#app');
    const fileInput = document.querySelector('#file');
    document.querySelector('button').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file) render(JSON.parse(await file.text()));
    });
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const render = (data) => {
      const audit = data.audit || data;
      const items = audit.items || [];
      const external = data.external_findings || [];
      const warnings = data.provider_errors || [];
      const needsReview = Boolean(audit.requires_review);
      const verdict = needsReview ? 'REVIEW REQUIRED' : 'PASS';
      app.innerHTML = `
        <span class="verdict ${needsReview ? 'review' : 'pass'}">${verdict}</span>
        <p class="subtle" style="margin-top:16px">${esc(audit.base)} → ${esc(audit.head)}</p>
        <div class="stats">
          <div class="stat">Changed files<strong>${audit.changed_files?.length || 0}</strong></div>
          <div class="stat">Memory findings<strong>${items.length}</strong></div>
          <div class="stat">External leads<strong>${external.length}</strong></div>
        </div>
        <div class="card"><h2>Memory findings</h2>${items.length ? items.map((item) => `
          <div class="finding"><strong>${esc(item.action)} · <code>${esc(item.id)}</code> · ${esc(item.title)}</strong>
          <p>Status: <code>${esc(item.status)}</code></p>
          ${(item.reasons || []).map((reason) => `<p>${esc(reason)}</p>`).join('')}</div>`).join('') : '<p class="subtle">No tracked memories are affected.</p>'}</div>
        <div class="card"><h2>External code context</h2>${external.length ? external.map((item) => `<div class="finding external"><strong><code>${esc(item.path)}${item.line_start ? ':' + esc(item.line_start) : ''}</code></strong><p>${esc(item.excerpt)}</p><p><code>external_unverified</code> · ${esc(item.source)}</p></div>`).join('') : '<p class="subtle">No external provider findings were attached.</p>'}</div>
        ${warnings.length ? `<div class="card warning"><h2>Provider warnings</h2>${warnings.map((warning) => `<p>${esc(warning)}</p>`).join('')}</div>` : ''}`;
    };
    fetch('review.json').then((response) => response.ok ? response.json() : Promise.reject()).then(render).catch(() => {});
  </script>
</body>
</html>
